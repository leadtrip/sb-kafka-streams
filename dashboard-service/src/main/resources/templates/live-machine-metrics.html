<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Metrics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
<div style="width: 80%; margin: auto;">
    <canvas id="metricsChart"></canvas>
</div>

<script>
    // 1. Initialize Chart.js
    const ctx = document.getElementById('metricsChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Machine Usage (%)', data: [], borderColor: '#4caf50' }] },
        options: { responsive: true }
    });

    // 2. Configure STOMP Client
    // Note: Point this to your Consumer App's URL/Port
    const client = new StompJs.Client({
        brokerURL: 'ws://localhost:9332/ws-metrics',
        onConnect: () => {
            console.log('Connected to WebSocket');
            client.subscribe('/topic/averages', (message) => {
                const data = JSON.parse(message.body);
                updateChart(data);
            });
        }
    });

    // 3. Update Chart Logic
    function updateChart(data) {
        chart.data.labels.push(new Date().toLocaleTimeString());
        chart.data.datasets[0].data.push(data.avg);

        // Keep only last 20 data points
        if (chart.data.labels.length > 20) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }
        chart.update();
    }

    client.activate();
</script>
</body>
</html>
