<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        .container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; font-family: sans-serif; }
        .card { width: 320px; border: 1px solid #ddd; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: #fff; }
        .timestamp { font-size: 0.8rem; color: #888; margin-top: 10px; display: block; }
    </style>
</head>
<body>
<h2>Server Monitor</h2>
<div id="dashboard" class="container"></div>

<script>
    const serverCharts = {};

    const formatTime = () => new Date().toLocaleTimeString('en-GB');

    function updateOrCreateChart(data) {
        if (!serverCharts[data.machine]) {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h3 style="margin-top:0">${data.machine}</h3>
                <canvas id="chart-${data.machine}"></canvas>
                <small class="timestamp" id="time-${data.machine}">Last updated: --:--:--</small>
            `;
            document.getElementById('dashboard').appendChild(div);

            const ctx = document.getElementById(`chart-${data.machine}`).getContext('2d');
            serverCharts[data.machine] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['CPU', 'RAM', 'DISK'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#ff6384', '#36a2eb', '#4bc0c0'],
                        borderRadius: 8, // <--- Rounded corners
                        borderSkipped: false
                    }]
                },
                options: {
                    indexAxis: 'y',
                    scales: { x: { min: 0, max: 100 } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        const typeMap = { 'CPU_USAGE': 0, 'RAM_USAGE': 1, 'DISK_USAGE': 2 };
        const chart = serverCharts[data.machine];

        chart.data.datasets[0].data[typeMap[data.type]] = data.avg;
        chart.update();

        document.getElementById(`time-${data.machine}`).textContent = `Last updated: ${formatTime()}`;
    }

    const client = new StompJs.Client({
        webSocketFactory: () => new SockJS('http://localhost:9332/ws-metrics'),
        onConnect: () => {
            client.subscribe('/topic/averages', (m) => updateOrCreateChart(JSON.parse(m.body)));
        }
    });
    client.activate();
</script>
</body>
</html>
